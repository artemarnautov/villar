<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villar · engine lab</title>
<link rel="icon" href="data:,">
<script type="importmap">{"imports":{
  "three":"/vendor/three/three.module.js",
  "three/addons/":"/vendor/three/addons/",
  "three/examples/jsm/":"/vendor/three/addons/",
  "three/webgpu":"/vendor/three/three.webgpu.js",
  "three/tsl":"/vendor/three/three.tsl.js",
  "three-mesh-bvh":"/vendor/three-mesh-bvh/src/index.js",
  "three-mesh-bvh/webgpu":"/vendor/three-mesh-bvh/src/webgpu/index.js",
  "three-gpu-pathtracer":"/vendor/three-gpu-pathtracer/src/index.js"
}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden;
    font: 12px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100vw - 24px);
    padding: 6px; border-radius: 10px; background: rgba(20,20,20,.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 2; }
  #bar button { all: unset; cursor: pointer; padding: 5px 8px; border-radius: 6px; color: #eee; background: rgba(255,255,255,.08); }
  #bar button:hover { background: rgba(255,255,255,.18); }
  #bar button.on { background: #f2efe9; color: #111; }
  #bar .sep { width: 1px; background: rgba(255,255,255,.2); margin: 0 2px; }
  #stat { position: fixed; right: 12px; bottom: 10px; color: rgba(255,255,255,.75); z-index: 2; text-shadow: 0 1px 2px #000; }
  #tip { position: fixed; pointer-events: none; z-index: 3; padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,.92); color: #111; display: none; }
  body.clean #bar, body.clean #stat { display: none; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="stat"></div>
<div id="tip"></div>
<script type="module">
import { loadData } from '/js/core/data.js';
import { createStore } from '/js/core/store.js';
import { createVillar } from '/js/engine/index.js';

const q = new URLSearchParams(location.search);
if (q.has('clean')) document.body.classList.add('clean');
const data = await loadData();
const store = createStore(data);
window.__villarStore = store; // lab/QA only
const villar = await createVillar({
  container: document.getElementById('stage'), store, ...data,
  quality: q.get('quality') || 'high',
  timeOfDay: q.get('tod') || 'day',
  view: q.get('view') || 'eye',
  adaptive: q.get('adaptive') !== '0',
  toneMapping: q.get('tm') || 'agx',
  gi: q.get('gi') !== '0',
  autoExposure: q.get('ae') !== '0',
});

const bar = document.getElementById('bar');
const stat = document.getElementById('stat');
const tip = document.getElementById('tip');
const group = (items, onPick, isOn) => {
  const btns = items.map(([id, label]) => {
    const b = document.createElement('button'); b.textContent = label; b.dataset.id = id;
    b.onclick = () => { onPick(id); sync(); };
    bar.appendChild(b); return b;
  });
  const sep = document.createElement('span'); sep.className = 'sep'; bar.appendChild(sep);
  const sync = () => btns.forEach((b) => b.classList.toggle('on', isOn(b.dataset.id)));
  sync(); return sync;
};
const syncView = group([['eye', 'Вход'], ['living', 'Гостиная'], ['bed', 'Спальня'], ['dining', 'Столовая'], ['window', 'Окно'], ['top', 'План']],
  (v) => villar.setView(v), (v) => villar.view === v);
const syncTime = group([['morning', 'Утро'], ['day', 'День'], ['golden', 'Закат'], ['evening', 'Вечер']],
  (t) => villar.setTimeOfDay(t), (t) => villar.timeOfDay === t);
group([['photo', 'Фото']], () => (villar.photoActive ? villar.stopPhoto() : villar.startPhoto()), () => villar.photoActive);
group([['swap', 'Случайная замена']], () => {
  const types = Object.keys(data.stylepack.slots).filter((t) => store.options(t).length > 1);
  if (!types.length) return;
  const t = types[(Math.random() * types.length) | 0];
  const opts = store.options(t).filter((it) => it.id !== store.selected(t)?.id);
  store.select(t, opts[(Math.random() * opts.length) | 0].id);
}, () => false);
const cur = { tm: q.get('tm') || 'agx' };
group([['agx', 'AgX'], ['aces', 'ACES'], ['neutral', 'Neutral']], (t) => { villar.debug.setToneMapping(t); cur.tm = t; }, (t) => cur.tm === t);

villar.on('hover', (p) => {
  if (!p) { tip.style.display = 'none'; return; }
  tip.style.display = 'block';
  tip.style.left = p.x + 14 + 'px'; tip.style.top = p.y + 14 + 'px';
  tip.textContent = `${p.item.name} · ${p.item.price} AED`;
});
villar.on('select', (p) => villar.highlight(p ? p.slotId : null));
let prog = '';
villar.on('progress', (p) => { prog = `фото ${p.samples}/${p.target}`; });
villar.on('photo', (p) => { if (p.state === 'stopped') prog = ''; });
setInterval(() => {
  const d = villar.debug;
  stat.textContent = `${d.quality} · dpr ${d.dpr.toFixed(2)} · ${d.fps ? d.fps.toFixed(0) + ' fps' : 'idle'} · calls ${d.info().calls} · tris ${(d.info().triangles / 1000).toFixed(0)}k ${prog ? '· ' + prog : ''}`;
  syncView(); syncTime();
}, 500);
</script>
</body>
</html>
