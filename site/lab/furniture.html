<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createMaterials, MATERIAL_KEYS, planarUVs } from '/js/engine/materials.js';
import { buildItem, ARCHETYPES } from '/js/engine/furniture/index.js';
import { softBox } from '/js/engine/furniture/geom.js';

// URL params:
//   ?item=<id>        one item close-up      &cam=close|front|side|top|back|low|far
//   ?type=<slotType>  only items of that type (grid)
//   ?mats=1           material swatch board    &only=key1,key2
//   ?tex=<key>        flat close-up of a material on a plane (0.5 m wide)  &span=metres
//   ?lit=1            lamps on (dim environment)
//   ?scene=1          small vignette: sofa+rug+coffee table+cushions+decor with anchors
//   ?catalog=<path>   alternative catalog json
const Q = new URLSearchParams(location.search);
const hud = document.getElementById('hud');
const t0 = performance.now();

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = Number(Q.get('exp') || 1.05);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#e7e3dd');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const lit = Q.has('lit');
scene.environmentIntensity = lit ? 0.12 : 0.55;
if (lit) scene.background = new THREE.Color('#2a2622');

const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.02, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = false;

const key = new THREE.DirectionalLight('#fff3e6', lit ? 0.25 : 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0002;
key.shadow.normalBias = 0.02;
key.shadow.radius = 4;
scene.add(key, key.target);
const fill = new THREE.HemisphereLight('#f4f1ec', '#b9b0a4', lit ? 0.05 : 0.5);
scene.add(fill);

const materials = createMaterials(renderer);
window.materials = materials;
materials.setLampsOn(lit);

// floor
const floorMat = materials.get(Q.get('floor') || 'paint', { color: '#d9d4cc' });
const floorGeo = planarUVs(new THREE.PlaneGeometry(60, 60).rotateX(-Math.PI / 2), 'xz');
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.receiveShadow = true;
scene.add(floor);

const labels = document.getElementById('labels');
const tags = [];
function label(text, sub, pos) {
  const d = document.createElement('div'); d.className = 'lbl';
  d.innerHTML = `<b>${text}</b>${sub ? '<br><i>' + sub + '</i>' : ''}`;
  labels.appendChild(d); tags.push({ d, pos });
}

function setKey(span, center) {
  key.position.set(center.x - span * 0.6, span * 1.3 + 2, center.z + span * 0.9);
  key.target.position.copy(center);
  const s = key.shadow.camera; const e = span * 0.8 + 1;
  s.left = -e; s.right = e; s.top = e; s.bottom = -e; s.near = 0.1; s.far = span * 4 + 10; s.updateProjectionMatrix();
}

function frame(obj, view = 'close', cam = camera) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y * 1.1, size.z) * 0.5 + 0.05;
  const zoom = Number(Q.get('zoom') || 1);
  const dist = r / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) * (view === 'far' ? 1.8 : 0.98) / zoom;
  const dirs = { close: [0.55, 0.38, 1], front: [0, 0.12, 1], side: [1, 0.15, 0], top: [0, 1, 0.02], back: [-0.5, 0.4, -1], low: [0.5, 0.08, 1], far: [0.55, 0.42, 1], three: [0.8, 0.5, 0.8], high: [0.4, 1.0, 0.8] };
  const d = new THREE.Vector3(...(dirs[view] || dirs.close)).normalize();
  if (Q.get('fx')) c.x += Number(Q.get('fx')); if (Q.get('fy')) c.y += Number(Q.get('fy'));
  cam.position.copy(c).addScaledVector(d, dist);
  cam.lookAt(c);
  if (cam === camera) { controls.target.copy(c); controls.update(); }
  cam.near = dist / 50; cam.far = dist * 20; cam.updateProjectionMatrix();
  setKey(Math.max(2, r * 3), c);
  return { c, r };
}

  { id: 'v-curt-2', type: 'curtains', dims: { w: 400, d: 10, h: 280 }, model: { archetype: 'curtains', params: { panels: 2, fabric: 'linen', color: '#ECE7DE', sheer: true } } },
];

async function loadCatalog() {
  const res = await fetch(Q.get('catalog') || '/data/catalog.json', { cache: 'no-cache' });
  const cat = await res.json();
  if (Q.has('variants')) cat.items = (Q.get('variants') === 'only' ? [] : cat.items).concat(VARIANTS);
  return cat;
}

const stats = [];
async function main() {
  if (Q.has('tex')) {
    const k = Q.get('tex');
    const span = Number(Q.get('span') || 0.5);
    const g = planarUVs(new THREE.PlaneGeometry(span, span), 'xy');
    const m = new THREE.Mesh(g, materials.get(k, Q.get('color') ? { color: '#' + Q.get('color') } : {}));
    m.position.y = span / 2 + 0.01; scene.add(m);
    camera.fov = 30; camera.updateProjectionMatrix();
    camera.position.set(0, span / 2, span * 1.95); controls.target.set(0, span / 2, 0); controls.update();
    key.position.set(-1.2, 2.5, 2.2); key.target.position.set(0, span / 2, 0);
    label(k, `${span} m`, new THREE.Vector3(0, -0.0, 0));
  } else if (Q.has('sheet')) {
    const cat = await loadCatalog();
    const ids = Q.get('sheet').split(',');
    const items = ids.map((id) => id.startsWith('m:') ? { swatch: id.slice(2) } : (cat.items.find((it) => it.id === id) || cat.items.find((it) => it.type === id))).filter(Boolean);
    const views = (Q.get('cams') || '').split(',');
    items.forEach((it, i) => {
      if (it.swatch) {
        const [k, colr] = it.swatch.split('#');
        const size = Number(Q.get('size') || 0.4);
        const m = materials.get(k, colr ? { color: '#' + colr } : {});
        const g = new THREE.Group();
        const box = new THREE.Mesh(materials.boxProjectUVs(softBox(size, size * 0.5, size, { r: size * 0.08, seg: 5, cell: size / 8, bulge: { top: size * 0.03 } })), m);
        box.position.y = size * 0.25; box.castShadow = box.receiveShadow = true; g.add(box);
        g.position.set(i * 30, 0, 0); scene.add(g);
        const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
        sheet.push({ g, cam, view: views[i] || Q.get('cam') || 'close', label: k });
        return;
      }
      const host = it.type === 'bedding' ? { w: 1.6, d: 2.0, h: 0.25 } : it.type === 'cushions' ? { w: 1.9 } : null;
      const g = buildItem(it, { materials, host });
      g.position.set(i * 30, it.type === 'pendant_lamp' ? 2.0 : it.type === 'wall_art' ? 1.0 : 0, 0);
      scene.add(g);
      if (lit) for (const L of g.userData.lights || []) { const l = new THREE.PointLight(L.color, (L.intensity || 1) * 1.2, L.distance || 4, 2); l.position.set(...L.position); g.add(l); }
      const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 100);
      sheet.push({ g, cam, view: views[i] || Q.get('cam') || 'close', label: `${it.id} · ${g.userData.triangles.toLocaleString('ru-RU')} tris` });
      stats.push([it.id, g.userData.triangles]);
    });
  } else if (Q.has('compose')) {
    // mini room vignette assembled through anchors, the way the engine does it
    const cat = await loadCatalog();
    const pick = Object.fromEntries((Q.get('pick') || '').split(',').filter(Boolean).map((id) => [cat.items.find((i) => i.id === id)?.type, id]));
    const first = (type) => cat.items.find((i) => i.id === pick[type]) || cat.items.find((i) => i.type === type);
    floor.material = materials.get('oak-floor', { species: 'oak-light' });
    const wallMat = materials.get('plaster-wall', { color: '#EDE7DE' });
    const wall = (w, h, x, z, ry) => { const g = materials.planarUVs(new THREE.PlaneGeometry(w, h), 'xy'); const m = new THREE.Mesh(g, wallMat); m.position.set(x, h / 2, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); };
    wall(9, 2.85, 0, -1.6, 0); wall(9, 2.85, -4.5, 1.5, Math.PI / 2);
    const place = (item, pos, rotY = 0, parent = scene, opts = {}) => {
      if (!item) return null;
      const g = buildItem(item, { materials, ...opts });
      g.position.set(...pos); g.rotation.y = rotY * Math.PI / 180; parent.add(g);
      if (lit) for (const L of g.userData.lights || []) { const l = new THREE.PointLight(L.color, (L.intensity || 1) * 1.5, L.distance || 4, 2); l.position.set(...L.position); l.castShadow = false; g.add(l); }
      stats.push([item.id, g.userData.triangles]);
      return g;
    };
    const attach = (parentObj, anchor, item, extra = {}) => {
      if (!parentObj || !item) return null;
      const a = parentObj.userData.anchors?.[anchor]; if (!a) return null;
      const host = parentObj.userData.anchorInfo?.[anchor] || null;
      return place(item, [a.x, a.y, a.z], 0, parentObj, { host, ...extra });
    };
    // living: sofa against back wall, rug, coffee table, armchair, side table, floor lamp, art above sofa
    const sofa = place(first('sofa'), [0, 0, -1.6 + 0.5], 0);
    attach(sofa, 'seat', first('cushions'));
    place(first('rug'), [0, 0, 0.3], 0);
    const ct = place(first('coffee_table'), [0, 0, 0.55], 0);
    attach(ct, 'top', first('decor_set'));
    place(first('armchair'), [1.9, 0, 0.9], -60);
    const st = place(first('side_table'), [-1.45, 0, -1.25], 0);
    place(first('floor_lamp'), [1.55, 0, -1.3], 0);
    place(first('wall_art'), [0, 1.55, -1.6], 0);
    place(first('plant'), [-2.2, 0, -1.2], 0);
    // bedroom on the left wall
    const bed = place(first('bed'), [-4.5 + 1.1, 0, 3.2], 90);
    const mat = attach(bed, 'deck', first('mattress'));
    attach(mat, 'top', first('bedding'));
    for (const dz of [-1.15, 1.15]) { const ns = place(first('nightstand'), [-4.5 + 0.25, 0, 3.2 + dz], 90); attach(ns, 'top', first('table_lamp')); }
    place(first('curtains'), [3.5, 0, -1.5], 0, scene, { span: 2.0 });
    const view = Q.get('view') || 'living';
    const views = { living: [[0.6, 1.45, 4.2], [0, 0.7, -0.6]], bed: [[0.6, 1.5, 3.6], [-3.6, 0.6, 3.0]], top: [[0, 8, 2.5], [0, 0, 1]], sofa: [[0.3, 1.1, 1.6], [0, 0.55, -1.1]] };
    const [cp, ct2] = views[view] || views.living;
    camera.fov = Number(Q.get('fov') || 50); camera.position.set(...cp); controls.target.set(...ct2); controls.update(); camera.updateProjectionMatrix();
    setKey(9, new THREE.Vector3(0, 0, 1));
    key.position.set(4, 5, 6);
  } else if (Q.has('mats')) {
    const only = Q.get('only') ? Q.get('only').split(',') : MATERIAL_KEYS;
    const cols = Math.ceil(Math.sqrt(only.length * 1.6));
    const sp = 0.75;
    only.forEach((k, i) => {
      const x = (i % cols) * sp, z = Math.floor(i / cols) * sp;
      const t1 = performance.now();
      const opts = k === 'wool-rug' ? { color: '#d8cdbb' } : k === 'canvas' ? { motif: 'abstract-arches', w: 0.4, h: 0.4 } : {};
      const m = materials.get(k, opts);
      const dt = performance.now() - t1;
      const g = softBox(0.4, 0.4, 0.4, { r: 0.05, seg: 4 });
      const mesh = new THREE.Mesh(materials.boxProjectUVs(g), m);
      mesh.position.set(x, 0.2, z); mesh.castShadow = mesh.receiveShadow = true;
      if (k === 'canvas') { mesh.geometry = new THREE.PlaneGeometry(0.4, 0.4); mesh.position.y = 0.2; }
      scene.add(mesh);
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.12, 48, 32), m);
      materials.boxProjectUVs(s.geometry);
      s.geometry = materials.boxProjectUVs(s.geometry);
      s.position.set(x + 0.26, 0.12, z + 0.22); s.castShadow = true; scene.add(s);
      label(k, `${dt.toFixed(0)} ms`, new THREE.Vector3(x, -0.0, z + 0.3));
      stats.push([k, Math.round(dt)]);
    });
    const span = cols * sp;
    camera.position.set(span * 0.45, span * 0.9, span * 1.35);
    controls.target.set((cols - 1) * sp / 2, 0, Math.ceil(only.length / cols) * sp / 2 - 0.2); controls.update();
    setKey(span, controls.target.clone());
  } else {
    const cat = await loadCatalog();
    let items = cat.items || [];
    if (Q.get('type')) items = items.filter((it) => it.type === Q.get('type') || it.model?.archetype === Q.get('type'));
    if (Q.get('item')) items = items.filter((it) => it.id === Q.get('item'));
    const objs = [];
    // grid layout: rows by footprint
    let x = 0, z = 0, rowD = 0; const maxRow = Number(Q.get('row') || 7.5);
    const sorted = Q.get('item') ? items : items.slice();
    for (const it of sorted) {
      const t1 = performance.now();
      const host = it.type === 'bedding' ? { w: 1.6, d: 2.0, h: 0.25 } : it.type === 'cushions' ? { w: 1.9 } : null;
      const g = buildItem(it, { materials, host });
      const dt = performance.now() - t1;
      const box = new THREE.Box3().setFromObject(g);
      const size = box.getSize(new THREE.Vector3());
      const w = Math.max(size.x, 0.4) + 0.45, d = Math.max(size.z, 0.4) + 0.6;
      if (x + w > maxRow && x > 0) { x = 0; z += rowD; rowD = 0; }
      g.position.set(x + w / 2, it.type === 'pendant_lamp' ? Math.max(1.2, size.y + 0.05) : it.type === 'wall_art' ? size.y / 2 + 0.3 : 0, z + d / 2);
      if (it.type === 'wall_art') g.position.z -= 0.2;
      scene.add(g); objs.push(g);
      label(it.id, `${it.type} · ${g.userData.triangles.toLocaleString('ru-RU')} tris · ${dt.toFixed(0)} ms`, new THREE.Vector3(g.position.x, 0, g.position.z + Math.max(size.z, 0.3) / 2 + 0.05));
      stats.push([it.id, g.userData.triangles, Math.round(dt)]);
      // lamp lights
      if (lit) for (const L of g.userData.lights || []) {
        const l = new THREE.PointLight(L.color, (L.intensity || 1) * 1.2, L.distance || 4, 2);
        l.position.set(...L.position); g.add(l);
      }
      // anchors debug
      if (Q.has('anchors')) for (const [k, v] of Object.entries(g.userData.anchors || {})) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.015), new THREE.MeshStandardMaterial({ color: 'red' })); s.position.copy(v); g.add(s);
      }
      x += w; rowD = Math.max(rowD, d);
    }
    const all = new THREE.Group(); objs.forEach((o) => all.add(o.clone(false)));
    if (Q.get('item')) frame(objs[0], Q.get('cam') || 'close');
    else {
      const bb = new THREE.Box3(); objs.forEach((o) => bb.expandByObject(o));
      const c = bb.getCenter(new THREE.Vector3()), s = bb.getSize(new THREE.Vector3());
      camera.fov = 28; camera.updateProjectionMatrix();
      const view = Q.get('cam') || 'grid';
      camera.position.set(c.x, Math.max(s.x, s.z) * 0.95, c.z + Math.max(s.x, s.z) * 1.35);
      if (view === 'top') camera.position.set(c.x, Math.max(s.x, s.z) * 2, c.z + 0.01);
      controls.target.set(c.x, 0.3, c.z + 0.2); controls.update();
      setKey(Math.max(s.x, s.z), c);
    }
  }
  window.__stats = stats;
  const tb = performance.now() - t0;
  render();
  const tr0 = performance.now();
  await materials.ready();
  hud.textContent = `${tb.toFixed(0)} ms build · textures +${(performance.now() - tr0).toFixed(0)} ms · ${renderer.capabilities.getMaxAnisotropy()}× aniso`;
  render();
  window.__labReady = true;
  console.log('LAB_STATS ' + JSON.stringify(stats));
}

const sheet = [];
const _v = new THREE.Vector3();
function render() {
  if (sheet.length) {
    const n = sheet.length, cols = n <= 2 ? n : n <= 4 ? 2 : 3, rows = Math.ceil(n / cols);
    const w = Math.floor(innerWidth / cols), h = Math.floor(innerHeight / rows);
    renderer.setScissorTest(true);
    labels.innerHTML = '';
    sheet.forEach((sh, i) => {
      const x = (i % cols) * w, y = innerHeight - (Math.floor(i / cols) + 1) * h;
      sh.cam.aspect = w / h; sh.cam.updateProjectionMatrix();
      frame(sh.g, sh.view, sh.cam);
      renderer.setViewport(x, y, w, h); renderer.setScissor(x, y, w, h);
      renderer.render(scene, sh.cam);
      const d = document.createElement('div'); d.className = 'lbl'; d.style.left = (x + w / 2) + 'px'; d.style.top = (innerHeight - y - 26) + 'px'; d.innerHTML = '<b>' + sh.label + '</b>'; labels.appendChild(d);
    });
    renderer.setScissorTest(false);
    return;
  }
  renderer.render(scene, camera);
  for (const t of tags) {
    _v.copy(t.pos).project(camera);
    t.d.style.left = ((_v.x * 0.5 + 0.5) * innerWidth) + 'px';
    t.d.style.top = ((-_v.y * 0.5 + 0.5) * innerHeight) + 'px';
    t.d.style.display = _v.z < 1 ? '' : 'none';
  }
}
controls.addEventListener('change', render);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); render(); });
camera.aspect = innerWidth / innerHeight;
main().catch((e) => { console.error(e); hud.textContent = 'ERROR: ' + e.message; });
</script>
</body>
</html>
